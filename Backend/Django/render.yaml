services:
  - type: web
    name: medical-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:10000 --workers 1 --threads 2 --timeout 120 --max-requests 500 --max-requests-jitter 50
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.10.13